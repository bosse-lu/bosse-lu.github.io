<script type="application/json" id="story-data">{"parts": [["One hot afternoon, a big Lion was sleeping under a tree in the forest. He was tired after a long day of hunting. Suddenly, a little Mouse ran across his nose and woke him up!", "The Lion was very angry. He caught the Mouse in his enormous paw. “How dare you wake me up!” roared the Lion. “I am going to eat you right now!”", "“Please, Mr Lion, don't eat me!” cried the Mouse. “I am very sorry. If you let me go, I promise I will help you one day.”", "The Lion laughed loudly. “You? Help me? You are so small and weak! But you are funny, so I will let you go.” He opened his paw, and the little Mouse ran away as fast as he could."], ["A few weeks later, some hunters came to the forest. They put a big net between the trees to catch animals. The Lion did not see the net, and he walked right into it! He was trapped.", "The Lion roared and roared, but the more he moved, the tighter the net became. He could not escape. “Somebody, please help me!” he shouted.", "The little Mouse heard the Lion's loud roar from far away. He remembered his promise, so he ran quickly to help his friend."], ["When the Mouse arrived, he saw the Lion trapped in the net. “Don't worry, my friend,” said the Mouse. “I promised to help you, and I will keep my promise!”", "The little Mouse began to bite the ropes of the net with his sharp teeth. He worked and worked, bite after bite, until finally… the net broke! The Lion was free!", "“Thank you, little Mouse,” said the Lion. “You saved my life. I was wrong — even a small friend can be a great friend.” From that day, the Lion and the Mouse were best friends forever."]], "moral": "Moral: No act of kindness, however small, is ever wasted.", "vocab": [["to sleep / to wake up", "dormir / se réveiller"], ["angry", "en colère"], ["a paw", "une patte"], ["to promise / a promise", "promettre / une promesse"], ["a hunter", "un chasseur"], ["a net / trapped", "un filet / piégé"], ["to roar", "rugir"], ["sharp teeth", "des dents pointues"], ["to save someone's life", "sauver la vie de quelqu'un"]]}</script>
