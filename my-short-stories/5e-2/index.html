<script type="application/json" id="story-data">{"parts": [["In a big green forest, there lived a hare and a tortoise. The hare was very fast, and he was very proud of his long legs. Every morning, he ran around the forest and shouted: “I'm the fastest animal in the world!”", "The tortoise was very slow. She walked carefully, one small step after another, and she never complained. One day, the hare laughed at her. “Look at you!” he said. “You are so slow! Do you ever arrive anywhere on time?”", "The tortoise looked at him calmly. “I am slow, but I always arrive,” she answered. “Let's have a race, and we will see who wins.” The hare laughed even louder, because he thought it was a joke. But the tortoise was serious, so all the animals of the forest decided to watch the race."], ["The next morning, the animals met near the old oak tree. The fox explained the rules: “The race starts here and finishes at the big river. Ready? Go!”", "The hare ran away like the wind. After a few minutes, he looked back, but he couldn't see the tortoise at all. “She is too slow,” he thought. “I have lots of time. I can have a little rest.” It was hot and sunny, so he lay down under a tree, closed his eyes and fell asleep.", "Meanwhile, the tortoise walked and walked. She didn't stop to eat, she didn't stop to play, and she didn't stop to sleep. Slowly, she passed the sleeping hare."], ["When the hare woke up, the sun was going down. “Oh no! I'm late!” he cried. He jumped up and ran to the river as fast as he could.", "But it was too late. When he arrived, all the animals were cheering, because the tortoise was already there. She was tired, but she was smiling.", "The hare was very embarrassed. “Why did you win?” he asked. “You are much slower than me.” The tortoise smiled. “Because I didn't stop,” she said. “You are faster, but you wasted your time.”", "From that day, the hare never laughed at the tortoise again."]], "moral": "Moral: Slow and steady wins the race.", "vocab": [["a hare / a tortoise", "un lièvre / une tortue"], ["proud", "fier"], ["to laugh at someone", "se moquer de quelqu'un"], ["a race / to win (won)", "une course / gagner"], ["to lie down (lay down)", "s'allonger"], ["to fall asleep (fell asleep)", "s'endormir"], ["meanwhile", "pendant ce temps"], ["to pass", "dépasser"], ["to cheer", "acclamer"], ["embarrassed", "gêné"], ["to waste time", "perdre son temps"], ["slow and steady", "lentement mais sûrement"]]}</script>
