<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Late and absent – Les évaluations – Collège Réeberg Néron</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* The evaluations of Late and absent on one page: Speaking test, DÒKÒ, and the final task by group.
   Learner: the class level, and only their group (★ = group 1, ★★ = group 2, ★★★ = group 3).
   Teacher (and visit code): every group, by clicking its tab, plus the notes for the teacher. */
:root{--paper:#f3f5fb;--card:#fff;--ink:#1b2340;--muted:#5b6380;--line:#d9ddea;--accent:#2f4fd8;--accent-soft:#e3e8ff;--good:#1f8a55;--good-soft:#dff3e8;--bad:#c2412d;--bad-soft:#fbe5df;--sun:#ffd23f;--sun-soft:#fff6d2;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;--body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#11152a;--card:#1a1f37;--ink:#e8ebf7;--muted:#9aa1bd;--line:#2d3456;--accent:#8ea2ff;--accent-soft:#262e57;--good:#4cc38a;--good-soft:#173a2b;--bad:#f0785f;--bad-soft:#3d2120;--sun-soft:#3a3315;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#11152a;--card:#1a1f37;--ink:#e8ebf7;--muted:#9aa1bd;--line:#2d3456;--accent:#8ea2ff;--accent-soft:#262e57;--good:#4cc38a;--good-soft:#173a2b;--bad:#f0785f;--bad-soft:#3d2120;--sun-soft:#3a3315;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.55;padding:24px max(16px,env(safe-area-inset-left,0px)) 56px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
a{color:var(--accent)}
.homelink{font-weight:600;font-size:14px;color:inherit;opacity:.75;text-decoration:none;align-self:center}
.kick{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2rem,7vw,3rem);line-height:1.02;margin:6px 0 0}
h1 span{color:var(--accent)}
.lead{color:var(--muted);margin:10px 0 0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{font:inherit;font-weight:700;border:0;background:none;color:var(--ink);padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--card)}
.ev{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.ev.final{border:2px solid var(--sun);background:linear-gradient(var(--sun-soft),var(--card) 140px)}
.ev-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.ev-h .n{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.ev-h h2{font-family:var(--display);font-size:1.5rem;line-height:1.1;margin:0;flex-basis:100%}
.pill{display:inline-block;font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:999px}
.on{background:var(--good-soft);color:var(--good)} .off{background:var(--bad-soft);color:var(--bad)}
.go{align-self:flex-start;font-weight:700;color:var(--card);background:var(--accent);border-radius:12px;padding:10px 16px;text-decoration:none}
.go[aria-disabled="true"]{background:var(--line);color:var(--muted);pointer-events:none}
.when{font-size:.92rem;background:var(--accent-soft);border-radius:10px;padding:8px 12px;margin:0}
.act{border-top:1px solid var(--line);padding-top:12px}
.act h3{font-family:var(--display);font-size:1.12rem;margin:0 0 4px}
.act p{margin:4px 0}
.act .en{font-weight:700}
.box{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;line-height:1.75}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px;font-size:.93rem;margin-top:6px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--paper);font-size:.8rem}
td.c{text-align:center}
ul,ol{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{font:inherit;font-weight:700;font-size:.92rem;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.cards .act{border:2px dashed var(--line);border-radius:12px;padding:10px 12px}
.lock{display:flex;gap:10px;align-items:flex-start;background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:12px 14px}
.lock b{display:block}
.mine{font-weight:700;color:var(--accent)}
.handin{border:2px dashed var(--accent);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--accent-soft)}
.handin h3{font-family:var(--display);margin:0;font-size:1.1rem}
.handin p{margin:0;font-size:.93rem}
.handin label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.93rem}
.handin select,.handin textarea{font:inherit;font-weight:400;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card);color:var(--ink)}
.handin textarea{min-height:150px;resize:vertical}
.bl{display:inline-block;min-width:80px;border-bottom:2px dotted var(--muted);height:1.1em;vertical-align:baseline}
/* Blanks of the gap scenes: the learner fills them in on the page (kept on this device) */
input.gap{font:inherit;font-weight:700;color:var(--accent);width:9.5em;max-width:60vw;border:0;border-bottom:2px solid var(--accent);background:var(--accent-soft);border-radius:6px 6px 0 0;padding:1px 6px;margin:0 2px}
input.gap:focus{outline:3px solid var(--accent);outline-offset:1px}
.foot{text-align:center;font-size:.85rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <a class="homelink" href="../late-and-absent/" id="back">← Late and absent</a>
  <header>
    <p class="kick">Late and absent · Axe 4 · École et loisirs</p>
    <h1>Les <span>évaluations</span></h1>
    <p class="lead" id="lead">Toutes les évaluations de la séquence, et ta tâche finale selon ton groupe.</p>
  </header>
  <div id="class-box" class="cl-box" aria-live="polite"></div>
  <div class="bar" id="lvbar" hidden><span>Version :</span><div class="seg" role="group" aria-label="Version"><button type="button" data-lv="5e">5e</button><button type="button" data-lv="4e">4e</button></div></div>
  <main id="evals" class="wrap" style="gap:18px;max-width:none"></main>
  <p class="foot">bosse-lu.github.io · Collège Réeberg Néron · M. Bosse</p>
</div>
<script src="../assets/consigne.js"></script>
<script src="../assets/export-pdf.js"></script>
<script src="data.js"></script>
<script src="../assets/reset.js"></script>
<script src="../assets/classes.js"></script>
<script>
(function () {
  const C = () => window.Classes, $ = (s, r = document) => r.querySelector(s);
  const SEQ = {"5e": "late-and-absent", "4e": "late-and-absent-4e"};
  let lvPick = "5e", tab = null;
  try { const s = JSON.parse(localStorage.getItem("evals-view") || "{}"); if (s.lv) lvPick = s.lv; if (s.tab != null) tab = s.tab; } catch (e) {}
  const save = () => { try { localStorage.setItem("evals-view", JSON.stringify({lv: lvPick, tab})); } catch (e) {} };

  // Who is looking: "staff" (teacher code, every level), "visit" (visit code, one level), "student", or null (no code)
  function who() {
    const c = C() && C().isReady() && C().klass();
    if (!c) return {role: null};
    if (c.admin) return {role: "staff", lv: lvPick, all: true};
    if (c.visit) return {role: "visit", lv: c.level, all: true};
    const st = C().stars() || 1;
    return {role: "student", lv: c.level === "4e" ? "4e" : "5e", group: st, all: false};
  }
  const actHTML = a => `<section class="act"><h3>${a.t}</h3>${a.en ? `<p class="en"${a.fr ? ` data-fr="${a.fr.replace(/"/g, "&quot;")}"` : ""}>${a.en}</p>` : ""}${a.html.replace(/<table/g, '<div class="tw"><table').replace(/<\/table>/g, "</table></div>")}</section>`;

  function test(e, w) {
    const open = w.all || C().evalOpen(SEQ[w.lv], e.id);
    return `<article class="ev"><div class="ev-h"><span class="n">${e.n}</span>${w.role === "student" ? `<span class="pill ${open ? "on" : "off"}">${open ? "Ouverte" : "🔒 Pas encore ouverte"}</span>` : ""}<h2>${e.title}</h2></div>
      ${w.all ? `<p class="when"><b>Pour le professeur :</b> ${e.when}</p>` : ""}
      ${e.acts.map(actHTML).join("")}
      <a class="go" href="${e.link}"${open ? "" : ' aria-disabled="true"'}>${open ? e.go + " →" : "🔒 " + e.go}</a></article>`;
  }

  function final(F, w) {
    const G = ["Groupe 1 · scène à trous", "Groupe 2 · situation à préparer", "Groupe 3 · cartes du jour"];
    let body;
    if (w.all) {
      const tabs = ["Organisation et grille", ...G];
      if (tab == null || tab > 3) tab = 0;
      const p = tab === 0 ? F.org : F.groups[tab - 1];
      const intro = p.acts.filter(a => !a.card), cards = p.acts.filter(a => a.card);
      body = `<div class="tabs" role="tablist" aria-label="Groupes">${tabs.map((t, i) => `<button type="button" role="tab" data-tab="${i}" aria-selected="${i === tab}">${t}</button>`).join("")}</div>
        <p class="when"><b>Pour le professeur :</b> ${p.when}</p>${intro.map(actHTML).join("")}${cards.length ? `<div class="cards">${cards.map(actHTML).join("")}</div>` : ""}`;
    } else {
      const g = Math.min(3, Math.max(1, w.group)), p = F.groups[g - 1];
      const open = C().evalOpen(SEQ[w.lv], "act-out");
      // Group 3 draws its card on the day: the cards stay hidden, the grid comes from the organisation page
      const acts = g === 3 ? [...p.acts.filter(a => !a.card), ...F.org.acts.filter(a => /Grille/.test(a.t))] : p.acts;
      body = `<p class="mine">Ton groupe : ${G[g - 1]}</p>` + (open ? acts.map(actHTML).join("") + (g === 3 ? `<p class="when">🎲 Ta carte sera tirée au sort le jour de l'évaluation. Prépare-toi avec l'<a href="../excuse-lab/">Excuse Lab</a>.</p>` : "")
        : `<div class="lock"><span aria-hidden="true">🔒</span><div><b>Ta tâche finale n'est pas encore ouverte.</b>Ton professeur l'ouvrira pour ta classe. En attendant, entraîne-toi avec l'<a href="../excuse-lab/">Excuse Lab</a>.</div></div>`);
    }
    return `<article class="ev final" id="final"><div class="ev-h"><span class="n">🎭 Tâche finale</span><h2>Act out the scene</h2></div>
      <p>En binôme, tu joues une scène de retard, d'absence ou de permission : l'un joue le professeur, l'autre l'élève, puis vous échangez les rôles. Tu expliques <b>la cause</b> ou <b>la conséquence</b> (ou les deux), au prétérit. On ne lit pas : on joue.</p>
      ${body}</article>`;
  }

  function draw() {
    const w = who(), box = $("#evals");
    $("#lvbar").hidden = w.role !== "staff";
    document.querySelectorAll("#lvbar [data-lv]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lv === lvPick)));
    $("#back").href = w.lv === "4e" ? "../late-and-absent-4e/" : "../late-and-absent/";
    if (!w.role) { box.innerHTML = `<div class="lock"><span aria-hidden="true">🏫</span><div><b>Entre le code de ta classe</b>pour voir tes évaluations et ta tâche finale.</div></div>`; return; }
    $("#lead").textContent = w.all ? `Version ${w.lv} : toutes les évaluations, et la tâche finale pour chaque groupe (cliquez sur un groupe).` : "Toutes les évaluations de la séquence, et ta tâche finale selon ton groupe.";
    const D = window.EVAL_DATA[w.lv];
    box.innerHTML = D.tests.map(e => test(e, w)).join("") + final(D.final, w);
    gaps(w); handIn(w);
    if (location.hash === "#final" && !draw.done) { draw.done = true; setTimeout(() => { const f = $("#final"); if (f) f.scrollIntoView(); }, 50); }
  }
  // The blanks of the gap scenes become fields to fill in; what the learner types stays on this device
  const GAP_KEY = "evals-gaps";
  let G = {}; try { G = JSON.parse(localStorage.getItem(GAP_KEY) || "{}"); } catch (e) {}
  function gaps(w) {
    document.querySelectorAll("#final .box").forEach((bx, si) => {
      const scene = (bx.closest(".act").querySelector("h3") || {}).textContent || String(si);
      bx.querySelectorAll(".bl").forEach((sp, i) => {
        const id = `${w.lv}|${scene}|${i}`, inp = document.createElement("input");
        inp.type = "text"; inp.className = "gap"; inp.lang = "en"; inp.autocomplete = "off"; inp.spellcheck = false;
        inp.setAttribute("aria-label", `${scene} : trou ${i + 1}`); inp.value = G[id] || "";
        inp.addEventListener("input", () => { G[id] = inp.value; try { localStorage.setItem(GAP_KEY, JSON.stringify(G)); } catch (e) {} });
        sp.replaceWith(inp);
      });
    });
  }
  /* ---------- Hand in on Pronote: the group 1 scene filled in, or the group 2 preparation, as a PDF ---------- */
  const PREP_KEY = "evals-prep";
  let P = {}; try { P = JSON.parse(localStorage.getItem(PREP_KEY) || "{}"); } catch (e) {}
  const savePrep = () => { try { localStorage.setItem(PREP_KEY, JSON.stringify(P)); } catch (e) {} };
  // Text of an element as paragraphs of styled runs (bold, italic); the fields give what the learner typed
  function paras(el) {
    const out = []; let cur = [];
    const push = () => { if (cur.some(r => r[0].trim())) out.push(cur); cur = []; };
    (function walk(n, st) {
      if (n.nodeType === 3) { const t = n.textContent.replace(/\s+/g, " "); if (t) cur.push([t, st]); return; }
      if (n.nodeType !== 1) return;
      const tag = n.tagName;
      if (tag === "BR") return push();
      if (tag === "INPUT") { cur.push([n.value.trim() ? " " + n.value.trim() + " " : " ________ ", "B"]); return; }
      if (tag === "TABLE") { push(); n.querySelectorAll("tr").forEach(tr => { const c = [...tr.children].map(td => td.textContent.trim()).filter(Boolean); if (c.length) out.push([[c.join("   ·   "), tr.querySelector("th") ? "B" : "R"]]); }); return; }
      if (tag === "BUTTON") return;
      if (n.classList.contains("cg-fr")) { push(); cur.push([n.textContent.trim(), "I"]); push(); return; }
      const block = /^(P|LI|DIV|H3|UL|OL|SECTION)$/.test(tag); if (block) push();
      const s2 = (tag === "B" || tag === "STRONG") ? (st.includes("I") ? "BI" : "B") : (tag === "I" || tag === "EM") ? (st.includes("B") ? "BI" : "I") : st;
      if (tag === "LI") cur.push(["•  ", "R"]);
      n.childNodes.forEach(c => walk(c, s2));
      if (block) push();
    })(el, "R");
    push(); return out.map(r => r.map(([t, st]) => [t.replace(/ {2,}/g, " "), st]));
  }
  function putActs(d, acts) {
    acts.forEach(a => {
      d.h(a.querySelector("h3").textContent, 13);
      [...a.children].filter(c => c.tagName !== "H3").forEach(c => paras(c).forEach(r => d.p(r, {size: 11, lead: 1.5, gap: 3})));
    });
  }
  function handIn(w) {
    const fin = $("#final"); if (!fin || !window.ExportPDF) return;
    const g = w.all ? (tab === 1 ? 1 : tab === 2 ? 2 : 0) : (C().evalOpen(SEQ[w.lv], "act-out") ? w.group : 0);
    if (g !== 1 && g !== 2) return;
    const acts = [...fin.querySelectorAll(".act")], grid = acts.find(a => /Grille/.test(a.querySelector("h3").textContent));
    const box = document.createElement("section"); box.className = "handin";
    if (g === 1) {
      box.innerHTML = `<h3>📄 Rendre ma scène sur Pronote</h3><p>Complète les trous ci-dessus, puis télécharge ta scène en PDF et dépose-la sur Pronote.</p>`;
      box.appendChild(ExportPDF.button("📄 Ma scène complétée en PDF", () => ({
        title: "Act out the scene · Groupe 1", file: "Act-out-the-scene_Groupe-1",
        intro: "Ta scène complétée se télécharge en PDF. Dépose-la ensuite sur Pronote.",
        build(d) { d.h("Act out the scene · Groupe 1 · " + w.lv, 16); putActs(d, acts.filter(a => a !== grid)); if (grid) putActs(d, [grid]); }
      })));
    } else {
      const sits = acts.filter(a => /^Situation/.test(a.querySelector("h3").textContent)), key = w.lv;
      const cur = P[key] || {sit: 0, text: ""};
      box.innerHTML = `<h3>✍️ Ma préparation · à rendre sur Pronote</h3>
        <label>Ma situation<select id="prep-sit">${sits.map((a, i) => `<option value="${i}"${i === +cur.sit ? " selected" : ""}>${a.querySelector("h3").textContent}</option>`).join("")}</select></label>
        <label>Mes mots-clés et mon dialogue (en anglais)<textarea id="prep-text" lang="en" placeholder="Teacher: … / Me: …"></textarea></label>
        <p>Ce que tu écris reste sur cet appareil. Télécharge-le en PDF pour le déposer sur Pronote.</p>`;
      const ta = box.querySelector("#prep-text"), sel = box.querySelector("#prep-sit"); ta.value = cur.text || "";
      ta.addEventListener("input", () => { P[key] = {sit: +sel.value, text: ta.value}; savePrep(); });
      sel.addEventListener("change", () => { P[key] = {sit: +sel.value, text: ta.value}; savePrep(); });
      box.appendChild(ExportPDF.button("📄 Ma préparation en PDF", () => ({
        title: "Act out the scene · Groupe 2", file: "Act-out-the-scene_Groupe-2",
        intro: "Ta situation et ta préparation se téléchargent en PDF. Dépose-les ensuite sur Pronote.",
        build(d) {
          d.h("Act out the scene · Groupe 2 · " + w.lv, 16);
          putActs(d, [sits[+sel.value]].filter(Boolean));
          d.h("Mes mots-clés et mon dialogue", 13);
          const t = ta.value.trim();
          if (t) t.split(/\n/).forEach(l => d.p(l || " ", {size: 11.5, lead: 1.55, gap: 2})); else d.lines(10);
          if (grid) putActs(d, [grid]);
        }
      })));
    }
    fin.appendChild(box);
  }
  document.addEventListener("click", e => {
    const t = e.target.closest("[data-tab]"); if (t) { tab = +t.dataset.tab; save(); draw(); const f = $("#final"); if (f) f.scrollIntoView({block: "start"}); return; }
    const l = e.target.closest("[data-lv]"); if (l) { lvPick = l.dataset.lv; save(); draw(); }
  });
  ["classes:ready", "classes:change"].forEach(ev => document.addEventListener(ev, draw));
  if (C()) C().mountPicker($("#class-box"));
  draw();
})();
</script>
</body>
</html>
